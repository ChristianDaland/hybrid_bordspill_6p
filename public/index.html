<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>6-Spillers Kamparena</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 300px; background: #222; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 2px solid #333; }
        #game-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #0a0a0a; }
        canvas { background: #1a1a1a; border: 4px solid #444; }
        .score-box { background: #333; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Kamparena (6P)</h2>
        <div id="qrcode"></div>
        <p>Skann for å bli med!</p>
        <div class="score-box" id="scoreboard">Venter på spillere...</div>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        new QRCode(document.getElementById("qrcode"), {
            text: `${window.location.origin}/mobile.html`,
            width: 120,
            height: 120
        });

        let gameState = { players: {}, puck: { x: 400, y: 300, radius: 12 } };
        const colors = ["#ff4444", "#ffbb33", "#00C851", "#33b5e5", "#aa66cc", "#ffbb33"];

        socket.on('state', (state) => {
            gameState = state;
            updateScoreboard();
        });

        function updateScoreboard() {
            let html = "<h3>Spillere & Poeng:</h3><ul>";
            for (let id in gameState.players) {
                let p = gameState.players[id];
                html > `<li>Spiller ${p.slot + 1}: ${p.score}p</li>`;
            }
            document.getElementById('scoreboard').innerHTML = html || "Ingen spillere tilkoblet";
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ytre ramme for banen
            const x1 = 60, x2 = 740, y1 = 60, y2 = 540;
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 4;
            ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

            // Tegn spillere basert på deres plass (0 til 5)
            for (let id in gameState.players) {
                let p = gameState.players[id];
                ctx.fillStyle = colors[p.slot % colors.length];
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;

                let pWidth = 80;
                let pHeight = 16;
                let posRatio = p.pos / 100;

                let px = 0, py = 0;

                if (p.slot === 0) {
                    // Venstre kortside
                    py = y1 + posRatio * (y2 - y1 - pWidth);
                    px = x1 - 10;
                    ctx.fillRect(px, py, pHeight, pWidth);
                    ctx.strokeRect(px, py, pHeight, pWidth);
                } else if (p.slot === 1) {
                    // Langside topp venstre
                    px = x1 + posRatio * ((x2 - x1) / 2 - pWidth);
                    py = y1 - 10;
                    ctx.fillRect(px, py, pWidth, pHeight);
                    ctx.strokeRect(px, py, pWidth, pHeight);
                } else if (p.slot === 2) {
                    // Langside topp høyre
                    px = x1 + (x2 - x1) / 2 + posRatio * ((x2 - x1) / 2 - pWidth);
                    py = y1 - 10;
                    ctx.fillRect(px, py, pWidth, pHeight);
                    ctx.strokeRect(px, py, pWidth, pHeight);
                } else if (p.slot === 3) {
                    // Høyre kortside
                    py = y1 + posRatio * (y2 - y1 - pWidth);
                    px = x2 - 6;
                    ctx.fillRect(px, py, pHeight, pWidth);
                    ctx.strokeRect(px, py, pHeight, pWidth);
                } else if (p.slot === 4) {
                    // Langside bunn høyre
                    px = x1 + (x2 - x1) / 2 + posRatio * ((x2 - x1) / 2 - pWidth);
                    py = y2 - 6;
                    ctx.fillRect(px, py, pWidth, pHeight);
                    ctx.strokeRect(px, py, pWidth, pHeight);
                } else if (p.slot === 5) {
                    // Langside bunn venstre
                    px = x1 + posRatio * ((x2 - x1) / 2 - pWidth);
                    py = y2 - 6;
                    ctx.fillRect(px, py, pWidth, pHeight);
                    ctx.strokeRect(px, py, pWidth, pHeight);
                }
            }

            // Tegn puck
            ctx.beginPath();
            ctx.arc(gameState.puck.x, gameState.puck.y, gameState.puck.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.closePath();

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
