<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Kamparena - Fotballbane</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; color: white; }
        #canvas { background: #2e8b57; border: 4px solid white; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let gameState = { players: {}, puck: { x: 400, y: 300, radius: 12 } };

        socket.on('state', (state) => {
            gameState = state;
        });

        const SLOT_COLORS = ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff', '#44ffff'];
        const SLOT_NAMES = ['Spiller 1', 'Spiller 2', 'Spiller 3', 'Spiller 4', 'Spiller 5', 'Spiller 6'];

        function drawField() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tegn bane-linjer
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            
            // Ytre ramme
            ctx.strokeRect(60, 60, 680, 480);

            // Midtlinje
            ctx.beginPath();
            ctx.moveTo(400, 60);
            ctx.lineTo(400, 540);
            ctx.stroke();

            // Midtsirkel
            ctx.beginPath();
            ctx.arc(400, 300, 70, 0, Math.PI * 2);
            ctx.stroke();

            // Målsoner (fargede felt)
            const sectionWidth = 340;
            const goalSize = 110;

            // Slot 0 (Venstre mål)
            ctx.fillStyle = SLOT_COLORS[0];
            ctx.fillRect(56, 300 - goalSize/2, 4, goalSize);

            // Slot 3 (Høyre mål)
            ctx.fillStyle = SLOT_COLORS[3];
            ctx.fillRect(740, 300 - goalSize/2, 4, goalSize);

            // Slot 1 & 2 (Topp mål)
            ctx.fillStyle = SLOT_COLORS[1];
            ctx.fillRect(60 + sectionWidth*0.25 - goalSize/2, 56, goalSize, 4);
            ctx.fillStyle = SLOT_COLORS[2];
            ctx.fillRect(60 + sectionWidth*1.25 - goalSize/2, 56, goalSize, 4);

            // Slot 4 & 5 (Bunn mål)
            ctx.fillStyle = SLOT_COLORS[5];
            ctx.fillRect(60 + sectionWidth*0.25 - goalSize/2, 540, goalSize, 4);
            ctx.fillStyle = SLOT_COLORS[4];
            ctx.fillRect(60 + sectionWidth*1.25 - goalSize/2, 540, goalSize, 4);

            // Tegn puck
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(gameState.puck.x, gameState.puck.y, gameState.puck.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();

            // Tegn spillere
            for (let id in gameState.players) {
                let p = gameState.players[id];
                ctx.fillStyle = SLOT_COLORS[p.slot] || '#00ffcc';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();

                // Navn på spiller
                ctx.fillStyle = 'white';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.name || SLOT_NAMES[p.slot], p.x, p.y - p.radius - 8);
            }
        }

        function loop() {
            drawField();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
