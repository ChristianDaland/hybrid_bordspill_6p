<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Kamparena - Bane</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #1a1a1a; border: 4px solid #444; box-shadow: 0 0 40px rgba(0,0,0,0.9); }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Automatisk skalering slik at banen fyller vinduet mest mulig uten å miste proporsjoner
        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600);
            canvas.style.width = `${800 * scale}px`;
            canvas.style.height = `${600 * scale}px`;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameState = { players: {}, puck: { x: 400, y: 300, radius: 12 } };
        const colors = ["#ff4444", "#ffbb33", "#aa66cc", "#33b5e5", "#00C851", "#ff8800"];

        socket.on('state', (state) => {
            gameState = state;
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const x1 = 60, x2 = 740, y1 = 60, y2 = 540;
            const sectionWidth = (x2 - x1) / 2;
            const goalSize = 110;

            let activeSlots = new Set();
            for (let id in gameState.players) {
                activeSlots.add(gameState.players[id].slot);
            }

            ctx.lineWidth = 6;

            // --- Tegn vegger / mål for hversone ---
            // Slot 0 (Venstre)
            if (activeSlots.has(0)) {
                ctx.strokeStyle = colors[0];
                ctx.beginPath(); ctx.moveTo(x1, 300 - goalSize/2); ctx.lineTo(x1, 300 + goalSize/2); ctx.stroke();
            } else {
                ctx.strokeStyle = "#444";
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1, y2); ctx.stroke();
            }

            // Slot 1 (Topp venstre)
            if (activeSlots.has(1)) {
                ctx.strokeStyle = colors[1];
                ctx.beginPath(); ctx.moveTo(x1 + sectionWidth/2 - goalSize/2, y1); ctx.lineTo(x1 + sectionWidth/2 + goalSize/2, y1); ctx.stroke();
            } else {
                ctx.strokeStyle = "#444";
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + sectionWidth, y1); ctx.stroke();
            }

            // Slot 2 (Topp høyre)
            if (activeSlots.has(2)) {
                ctx.strokeStyle = colors[2];
                ctx.beginPath(); ctx.moveTo(x1 + sectionWidth + sectionWidth/2 - goalSize/2, y1); ctx.lineTo(x1 + sectionWidth + sectionWidth/2 + goalSize/2, y1); ctx.stroke();
            } else {
                ctx.strokeStyle = "#444";
                ctx.beginPath(); ctx.moveTo(x1 + sectionWidth, y1); ctx.lineTo(x2, y1); ctx.stroke();
            }

            // Slot 3 (Høyre)
            if (activeSlots.has(3)) {
                ctx.strokeStyle = colors[3];
                ctx.beginPath(); ctx.moveTo(x2, 300 - goalSize/2); ctx.lineTo(x2, 300 + goalSize/2); ctx.stroke();
            } else {
                ctx.strokeStyle = "#444";
                ctx.beginPath(); ctx.moveTo(x2, y1); ctx.lineTo(x2, y2); ctx.stroke();
            }

            // Slot 4 (Bunn høyre)
            if (activeSlots.has(4)) {
                ctx.strokeStyle = colors[4];
                ctx.beginPath(); ctx.moveTo(x1 + sectionWidth + sectionWidth/2 - goalSize/2, y2); ctx.lineTo(x1 + sectionWidth + sectionWidth/2 + goalSize/2, y2); ctx.stroke();
            } else {
                ctx.strokeStyle = "#444";
                ctx.beginPath(); ctx.moveTo(x1 + sectionWidth, y2); ctx.lineTo(x2, y2); ctx.stroke();
            }

            // Slot 5 (Bunn venstre)
            if (activeSlots.has(5)) {
                ctx.strokeStyle = colors[5];
                ctx.beginPath(); ctx.moveTo(x1 + sectionWidth/2 - goalSize/2, y2); ctx.lineTo(x1 + sectionWidth/2 + goalSize/2, y2); ctx.stroke();
            } else {
                ctx.strokeStyle = "#444";
                ctx.beginPath(); ctx.moveTo(x1, y2); ctx.lineTo(x1 + sectionWidth, y2); ctx.stroke();
            }

            // Faste sidevegger rundt målene for aktive soner
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 4;
            if (activeSlots.has(0)) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1, 300 - goalSize/2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x1, 300 + goalSize/2); ctx.lineTo(x1, y2); ctx.stroke(); }
            if (activeSlots.has(1)) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + sectionWidth/2 - goalSize/2, y1); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x1 + sectionWidth/2 + goalSize/2, y1); ctx.lineTo(x1 + sectionWidth, y1); ctx.stroke(); }
            if (activeSlots.has(2)) { ctx.beginPath(); ctx.moveTo(x1 + sectionWidth, y1); ctx.lineTo(x1 + sectionWidth + sectionWidth/2 - goalSize/2, y1); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x1 + sectionWidth + sectionWidth/2 + goalSize/2, y1); ctx.lineTo(x2, y1); ctx.stroke(); }
            if (activeSlots.has(3)) { ctx.beginPath(); ctx.moveTo(x2, y1); ctx.lineTo(x2, 300 - goalSize/2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x2, 300 + goalSize/2); ctx.lineTo(x2, y2); ctx.stroke(); }
            if (activeSlots.has(4)) { ctx.beginPath(); ctx.moveTo(x1 + sectionWidth, y2); ctx.lineTo(x1 + sectionWidth + sectionWidth/2 - goalSize/2, y2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x1 + sectionWidth + sectionWidth/2 + goalSize/2, y2); ctx.lineTo(x2, y2); ctx.stroke(); }
            if (activeSlots.has(5)) { ctx.beginPath(); ctx.moveTo(x1, y2); ctx.lineTo(x1 + sectionWidth/2 - goalSize/2, y2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x1 + sectionWidth/2 + goalSize/2, y2); ctx.lineTo(x1 + sectionWidth, y2); ctx.stroke(); }

            // Spillernavn bak målene
            ctx.font = "bold 13px sans-serif";
            ctx.textAlign = "center";
            for (let id in gameState.players) {
                let p = gameState.players[id];
                ctx.fillStyle = colors[p.slot % colors.length];
                if (p.slot === 0) ctx.fillText(p.name, x1 - 35, 304);
                if (p.slot === 1) ctx.fillText(p.name, x1 + sectionWidth/2, y1 - 12);
                if (p.slot === 2) ctx.fillText(p.name, x1 + sectionWidth + sectionWidth/2, y1 - 12);
                if (p.slot === 3) ctx.fillText(p.name, x2 + 35, 304);
                if (p.slot === 4) ctx.fillText(p.name, x1 + sectionWidth + sectionWidth/2, y2 + 22);
                if (p.slot === 5) ctx.fillText(p.name, x1 + sectionWidth/2, y2 + 22);
            }

            // Målvakter
            for (let id in gameState.players) {
                let p = gameState.players[id];
                if (p.absX !== undefined && p.absY !== undefined) {
                    ctx.beginPath();
                    ctx.arc(p.absX, p.absY, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = colors[p.slot % colors.length];
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "#ffffff";
                    ctx.stroke();
                    ctx.closePath();
                }
            }

            // Puck
            ctx.beginPath();
            ctx.arc(gameState.puck.x, gameState.puck.y, gameState.puck.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.closePath();

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
