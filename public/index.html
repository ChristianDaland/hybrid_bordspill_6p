<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>6-Spillers Kamparena</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 300px; background: #222; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 2px solid #333; }
        #game-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #0a0a0a; }
        canvas { background: #1a1a1a; border: 4px solid #444; }
        .score-box { background: #333; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Kamparena (6P)</h2>
        <div id="qrcode"></div>
        <p>Skann for å bli med!</p>
        <div class="score-box" id="scoreboard">Venter på spillere...</div>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        new QRCode(document.getElementById("qrcode"), {
            text: `${window.location.origin}/mobile.html`,
            width: 120,
            height: 120
        });

        let gameState = { players: {}, puck: { x: 400, y: 300, radius: 12 } };

        socket.on('state', (state) => {
            gameState = state;
            updateScoreboard();
        });

        function updateScoreboard() {
            let html = "<h3>Poengtavle:</h3><ul>";
            for (let id in gameState.players) {
                let p = gameState.players[id];
                html += `<li>Plass ${p.slot + 1}: ${p.score} poeng</li>`;
            }
            html += "</ul>";
            document.getElementById('scoreboard').innerHTML = html;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tegn rektangulær bane
            ctx.strokeStyle = "#666";
            ctx.lineWidth = 6;
            ctx.strokeRect(20, 20, 760, 560);

            // Tegn målområder / soner for de 6 spillerne
            // Venstre kortside (Spiller 0)
            ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
            ctx.fillRect(20, 20, 15, 560);

            // Langside topp (Spiller 1 og 2)
            ctx.fillRect(35, 20, 365, 15);
            ctx.fillRect(400, 20, 365, 15);

            // Høyre kortside (Spiller 3)
            ctx.fillRect(765, 20, 15, 560);

            // Langside bunn (Spiller 4 og 5)
            ctx.fillRect(400, 565, 365, 15);
            ctx.fillRect(35, 565, 365, 15);

            // Tegn puck
            ctx.beginPath();
            ctx.arc(gameState.puck.x, gameState.puck.y, gameState.puck.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.closePath();

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
