<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>6-Spillers Kamparena</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 300px; background: #222; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 2px solid #333; box-sizing: border-box; }
        #game-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #0a0a0a; }
        canvas { background: #1a1a1a; border: 4px solid #444; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .score-box { background: #333; padding: 15px; border-radius: 8px; font-size: 15px; line-height: 1.5; }
        ul { padding-left: 20px; margin: 5px 0; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Kamparena (6P)</h2>
        <div id="qrcode"></div>
        <p>Skann for å bli med på mobilen!</p>
        <div class="score-box" id="scoreboard">Venter på spillere...</div>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        new QRCode(document.getElementById("qrcode"), {
            text: `${window.location.origin}/mobile.html`,
            width: 120,
            height: 120
        });

        let gameState = { players: {}, puck: { x: 400, y: 300, radius: 12 } };
        const colors = ["#ff4444", "#ffbb33", "#00C851", "#33b5e5", "#aa66cc", "#ffbb33"];

        socket.on('state', (state) => {
            gameState = state;
            updateScoreboard();
        });

        function updateScoreboard() {
            let html = "<b>Spillere & Poeng:</b><ul>";
            let count = 0;
            for (let id in gameState.players) {
                let p = gameState.players[id];
                html += `<li>Spiller ${p.slot + 1}: <span style="color:${colors[p.slot % colors.length]}">${p.score}p</span></li>`;
                count++;
            }
            html += "</ul>";
            document.getElementById('scoreboard').innerHTML = count > 0 ? html : "Ingen spillere tilkoblet";
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const x1 = 60, x2 = 740, y1 = 60, y2 = 540;
            const sectionWidth = (x2 - x1) / 2;

            // Tegn alle 6 målsoner i sine respektive farger (uansett om spiller er tilkoblet eller ei)
            ctx.lineWidth = 6;
            
            // Slot 0 (Venstre mål)
            ctx.strokeStyle = colors[0];
            ctx.beginPath(); ctx.moveTo(x1, y1 + 100); ctx.lineTo(x1, y2 - 100); ctx.stroke();

            // Slot 1 (Topp venstre mål)
            ctx.strokeStyle = colors[1];
            ctx.beginPath(); ctx.moveTo(x1 + 50, y1); ctx.lineTo(x1 + sectionWidth - 50, y1); ctx.stroke();

            // Slot 2 (Topp høyre mål)
            ctx.strokeStyle = colors[2];
            ctx.beginPath(); ctx.moveTo(x1 + sectionWidth + 50, y1); ctx.lineTo(x2 - 50, y1); ctx.stroke();

            // Slot 3 (Høyre mål)
            ctx.strokeStyle = colors[3];
            ctx.beginPath(); ctx.moveTo(x2, y1 + 100); ctx.lineTo(x2, y2 - 100); ctx.stroke();

            // Slot 4 (Bunn høyre mål)
            ctx.strokeStyle = colors[4];
            ctx.beginPath(); ctx.moveTo(x1 + sectionWidth + 50, y2); ctx.lineTo(x2 - 50, y2); ctx.stroke();

            // Slot 5 (Bunn venstre mål)
            ctx.strokeStyle = colors[5];
            ctx.beginPath(); ctx.moveTo(x1 + 50, y2); ctx.lineTo(x1 + sectionWidth - 50, y2); ctx.stroke();

            // Tegn lukkede vegger der det IKKE er spillere, slik at banen er tett
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 4;
            
            // Sjekk hvilke slots som er aktive
            let activeSlots = new Set();
            for (let id in gameState.players) {
                activeSlots.add(gameState.players[id].slot);
            }

            if (!activeSlots.has(0)) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1, y1 + 100); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x1, y2 - 100); ctx.lineTo(x1, y2); ctx.stroke(); }
            if (!activeSlots.has(1)) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + 50, y1); ctx.stroke(); }
            if (!activeSlots.has(2)) { ctx.beginPath(); ctx.moveTo(x2 - 50, y1); ctx.lineTo(x2, y1); ctx.stroke(); }
            if (!activeSlots.has(3)) { ctx.beginPath(); ctx.moveTo(x2, y1); ctx.lineTo(x2, y1 + 100); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x2, y2 - 100); ctx.lineTo(x2, y2); ctx.stroke(); }
            if (!activeSlots.has(4)) { ctx.beginPath(); ctx.moveTo(x1 + sectionWidth + 50, y2); ctx.lineTo(x2, y2); ctx.stroke(); }
            if (!activeSlots.has(5)) { ctx.beginPath(); ctx.moveTo(x1, y2); ctx.lineTo(x1 + 50, y2); ctx.stroke(); }

            // Tegn sirkulære målvakter for aktiverte spillere
            for (let id in gameState.players) {
                let p = gameState.players[id];
                if (p.absX !== undefined && p.absY !== undefined) {
                    ctx.beginPath();
                    ctx.arc(p.absX, p.absY, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = colors[p.slot % colors.length];
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "#ffffff";
                    ctx.stroke();
                    ctx.closePath();
                }
            }

            // Tegn puck
            ctx.beginPath();
            ctx.arc(gameState.puck.x, gameState.puck.y, gameState.puck.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.closePath();

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
