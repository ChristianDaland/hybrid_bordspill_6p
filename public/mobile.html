<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kamparena - Mobilkontroll</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        #login-screen { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        input { padding: 12px; font-size: 16px; border-radius: 6px; border: none; text-align: center; width: 220px; }
        button { padding: 12px 24px; font-size: 16px; background: #00ffcc; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #111; }
        
        #joystick-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        #joystick-container { position: relative; width: 260px; height: 260px; background: #222; border-radius: 50%; border: 4px solid #444; display: flex; justify-content: center; align-items: center; margin-top: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        #status { font-size: 20px; color: #00ffcc; font-weight: bold; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Bli med i Kamparena</h2>
        <input type="text" id="username" placeholder="Skriv ditt navn..." maxlength="15">
        <button onclick="joinGame()">Start Spill</button>
    </div>

    <div id="joystick-screen">
        <div id="status">Kobler til...</div>
        <p style="color: #aaa; font-size: 14px; margin: 0 0 20px 0;">Dra hvor som helst i sirkelen for å styre</p>
        <div id="joystick-container"></div>
    </div>

    <script>
        const socket = io();
        let mySlot = null;

        function joinGame() {
            const name = document.getElementById('username').value.trim();
            if (!name) return alert('Vennligst skriv et navn!');
            
            socket.emit('set-name', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('joystick-screen').style.display = 'flex';
        }

        socket.on('assigned-slot', (slot) => {
            mySlot = slot;
            document.getElementById('status').innerText = `Spiller ${slot + 1} - Klar!`;
        });

        socket.on('full', () => {
            alert('Spillet er fullt!');
            location.reload();
        });

        // Berøringssone logikk (uten fast prikk)
        const container = document.getElementById('joystick-container');
        let touching = false;
        
        const centerOffset = 130; // Halvparten av 260px bredde/høyde
        const maxDist = 100;

        function handleTouch(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            let x = clientX - rect.left;
            let y = clientY - rect.top;

            let dx = x - centerOffset;
            let dy = y - centerOffset;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            // Beregn hastighet basert på hvor langt fra sentrum fingeren er
            let vx = (dx / maxDist) * 6; 
            let vy = (dy / maxDist) * 6;

            socket.emit('move', { vx, vy });
        }

        container.addEventListener('touchstart', (e) => {
            touching = true;
            let touch = e.touches[0];
            handleTouch(touch.clientX, touch.clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (!touching) return;
            let touch = e.touches[0];
            handleTouch(touch.clientX, touch.clientY);
        });

        window.addEventListener('touchend', () => {
            if (!touching) return;
            touching = false;
            socket.emit('move', { vx: 0, vy: 0 }); // Stopp når man slipper fingeren
        });

        // Mus-støtte for testing på PC
        container.addEventListener('mousedown', (e) => {
            touching = true;
            handleTouch(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            if (!touching) return;
            handleTouch(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => {
            if (!touching) return;
            touching = false;
            socket.emit('move', { vx: 0, vy: 0 });
        });
    </script>
</body>
</html>
