<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kamparena - Mobilkontroll</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        #login-screen { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        input { padding: 12px; font-size: 16px; border-radius: 6px; border: none; text-align: center; width: 220px; }
        button { padding: 12px 24px; font-size: 16px; background: #00ffcc; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #joystick-container { display: none; position: relative; width: 250px; height: 250px; background: #222; border-radius: 50%; border: 4px solid #444; justify-content: center; align-items: center; margin-top: 20px; }
        #stick { position: absolute; width: 80px; height: 80px; background: #00ffcc; border-radius: 50%; top: 85px; left: 85px; touch-action: none; box-shadow: 0 4px 15px rgba(0,255,204,0.4); }
        #status { font-size: 18px; color: #aaa; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Bli med i Kamparena</h2>
        <input type="text" id="username" placeholder="Skriv ditt navn..." maxlength="15">
        <button onclick="joinGame()">Start Spill</button>
    </div>

    <div id="joystick-screen" style="display:none; flex-direction: column; align-items: center;">
        <div id="status">Koble til...</div>
        <div id="joystick-container">
            <div id="stick"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let mySlot = null;

        function joinGame() {
            const name = document.getElementById('username').value.trim();
            if (!name) return alert('Vennligst skriv et navn!');
            
            socket.emit('set-name', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('joystick-screen').style.display = 'flex';
        }

        socket.on('assigned-slot', (slot) => {
            mySlot = slot;
            document.getElementById('status').innerText = `Spiller ${slot + 1} - Styr med kontrollen`;
        });

        socket.on('full', () => {
            alert('Spillet er fullt!');
            location.reload();
        });

        // Joystick logikk
        const container = document.getElementById('joystick-container');
        const stick = document.getElementById('stick');
        let dragging = false;
        let center = { x: 125, y: 125 };
        let maxDist = 85;

        function handleTouch(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            let x = clientX - rect.left - center.x;
            let y = clientY - rect.top - center.y;
            let dist = Math.sqrt(x * x + y * y);

            if (dist > maxDist) {
                x = (x / dist) * maxDist;
                y = (y / dist) * maxDist;
            }

            stick.style.transform = `translate(${x}px, ${y}px)`;

            // Beregn hastighet basert på hvor langt prikken er dratt (skalert ned til passe fart)
            let vx = (x / maxDist) * 6; 
            let vy = (y / maxDist) * 6;

            socket.emit('move', { vx, vy });
        }

        stick.addEventListener('touchstart', (e) => { dragging = true; });
        window.addEventListener('touchmove', (e) => {
            if (!dragging) return;
            let touch = e.touches[0];
            handleTouch(touch.clientX, touch.clientY);
        });
        window.addEventListener('touchend', () => {
            if (!dragging) return;
            dragging = false;
            stick.style.transform = `translate(0px, 0px)`;
            socket.emit('move', { vx: 0, vy: 0 }); // Stopp når man slipper
        });

        // For testing med mus på PC hvis ønskelig
        stick.addEventListener('mousedown', (e) => { dragging = true; });
        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            handleTouch(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => {
            if (!dragging) return;
            dragging = false;
            stick.style.transform = `translate(0px, 0px)`;
            socket.emit('move', { vx: 0, vy: 0 });
        });
    </script>
</body>
</html>
