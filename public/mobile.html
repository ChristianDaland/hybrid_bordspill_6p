<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobilkontroll</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; padding: 30px; }
        input[type=range] { width: 100%; margin-top: 50px; height: 50px; }
        .slot-info { font-size: 24px; color: #00ffcc; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Målvakt-kontroll</h2>
    <div class="slot-info" id="slotText">Kobler til...</div>

    <div style="margin-top: 50px;">
        <label for="slider">Skyv for å flytte planke:</label><br>
        <input type="range" id="slider" min="0" max="100" value="50">
    </div>

    <script>
        const socket = io();
        const slider = document.getElementById('slider');
        const slotText = document.getElementById('slotText');

        socket.on('assigned-slot', (slot) => {
            slotText.innerText = `Du vokter sone ${slot + 1}`;
        });

        socket.on('full', () => {
            slotText.innerText = 'Spillet er fullt!';
            slider.disabled = true;
        });

        slider.addEventListener('input', (e) => {
            socket.emit('move', { pos: parseInt(e.target.value) });
        });
    </script>
</body>
</html>
