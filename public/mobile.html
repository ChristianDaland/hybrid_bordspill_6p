<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobilkontroll - Målvakt</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        .slot-info { font-size: 22px; color: #00ffcc; margin-bottom: 20px; font-weight: bold; }
        #name-screen { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 300px; }
        #name-screen input { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; text-align: center; }
        #name-screen button { padding: 12px; font-size: 16px; border-radius: 6px; border: none; background: #00C851; color: white; font-weight: bold; cursor: pointer; }
        #joystick-screen { display: none; flex-direction: column; align-items: center; }
        #joystick-container {
            width: 260px;
            height: 260px;
            background: #1a1a1a;
            border: 3px dashed #444;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        #stick {
            width: 70px;
            height: 70px;
            background: #ff4444;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        p { color: #888; font-size: 14px; margin-top: 25px; }
    </style>
</head>
<body>
    <div id="name-screen">
        <h2>Skriv inn ditt navn</h2>
        <input type="text" id="playerNameInput" placeholder="Ditt navn..." maxlength="15">
        <button id="joinBtn">Bli med i spillet</button>
    </div>

    <div id="joystick-screen">
        <div class="slot-info" id="slotText">Kobler til...</div>
        <div id="joystick-container">
            <div id="stick"></div>
        </div>
        <p>Dra prikken for å styre målvakten og gi fart til ballen!</p>
    </div>

    <script>
        const socket = io();
        const nameScreen = document.getElementById('name-screen');
        const joystickScreen = document.getElementById('joystick-screen');
        const playerNameInput = document.getElementById('playerNameInput');
        const joinBtn = document.getElementById('joinBtn');
        const slotText = document.getElementById('slotText');
        const container = document.getElementById('joystick-container');
        const stick = document.getElementById('stick');

        let assignedSlot = null;
        let isDragging = false;
        let center = { x: 130, y: 130 };
        let maxRadius = 90;
        let stickPos = { x: 0, y: 0 };

        const colors = ["#ff4444", "#ffbb33", "#aa66cc", "#33b5e5", "#00C851", "#ff8800"];

        joinBtn.addEventListener('click', () => {
            let name = playerNameInput.value.trim() || "Spiller";
            socket.emit('set-name', name);
            nameScreen.style.display = 'none';
            joystickScreen.style.display = 'flex';
        });

        socket.on('assigned-slot', (slot) => {
            assignedSlot = slot;
            slotText.innerText = `Sone ${slot + 1}`;
            stick.style.background = colors[slot % colors.length];
        });

        socket.on('full', () => {
            slotText.innerText = 'Spillet er fullt!';
        });

        function handleTouch(clientX, clientY) {
            const rect = container.getBoundingClientRect();
            let dx = clientX - (rect.left + center.x);
            let dy = clientY - (rect.top + center.y);
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;

            stickPos.x = dx / maxRadius;
            stickPos.y = dy / maxRadius;

            socket.emit('move', { x: stickPos.x, y: stickPos.y });
        }

        function resetStick() {
            isDragging = false;
            stick.style.transform = `translate(0px, 0px)`;
            stickPos.x = 0;
            stickPos.y = 0;
            socket.emit('move', { x: 0, y: 0 });
        }

        stick.addEventListener('touchstart', (e) => { isDragging = true; e.preventDefault(); });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            handleTouch(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault();
        }, { passive: false });
        window.addEventListener('touchend', resetStick);

        stick.addEventListener('mousedown', (e) => { isDragging = true; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            handleTouch(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', resetStick);
    </script>
</body>
</html>
